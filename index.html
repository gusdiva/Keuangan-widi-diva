<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Keuangan DIVA & WIDI</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Library Generator PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- BAGIAN BANNER BARU (Menggantikan Logo Lama) -->
    <div class="w-full mb-6 mt-2">
        <img src="banner.png" alt="Banner Aplikasi" class="w-full h-36 object-cover rounded-3xl shadow-xs">
    </div>

    <div class="bg-white rounded-3xl p-5 shadow-sm mb-6 border border-slate-100">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
                <span class="text-xl">📊</span>
                <h2 class="font-bold text-slate-800 text-base">Ringkasan Keuangan</h2>
            </div>
            <span id="badge-nama" class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">DIVA</span>
        </div>
        
        <p id="waktu-update" class="text-xs italic text-slate-400 mb-4">Memuat data terbaru...</p>
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Finansial Diva & Widi</h1>
                <p class="text-xs text-slate-500">Pencatatan transaksi harian</p>
            </div>
            <button onclick="downloadRekapPDF()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm active:scale-95">
                📄 Download PDF
            </button>
        </div>

        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl mb-4">
            <button id="btn-tab-diva" onclick="switchTab('DIVA')" class="py-2.5 rounded-xl font-bold text-sm transition-all duration-200 bg-white text-emerald-600 shadow-xs flex items-center justify-center gap-2 cursor-pointer">
                👦 DIVA
            </button>
            <button id="btn-tab-widi" onclick="switchTab('WIDI')" class="py-2.5 rounded-xl font-bold text-sm transition-all duration-200 text-slate-500 hover:bg-white/50 flex items-center justify-center gap-2 cursor-pointer">
                👩 WIDI
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm border-collapse">
                <thead>
                    <tr class="border-b border-slate-100 text-slate-400 text-xs uppercase font-semibold">
                        <th id="label-tabel-nama" class="pb-2">DIVA</th>
                        <th class="pb-2 text-right">Bulanan</th>
                        <th class="pb-2 text-right">Mingguan</th>
                        <th class="pb-2 text-right">Harian</th>
                    </tr>
                </thead>
                <tbody id="body-tabel-dashboard" class="text-slate-600 font-medium">
                    <tr class="border-b border-slate-50"><td class="py-2.5 text-slate-400">Pemasukan (+)</td><td class="text-right py-2.5">Rp0</td><td class="text-right py-2.5">Rp0</td><td class="text-right py-2.5">Rp0</td></tr>
                    <tr class="border-b border-slate-50"><td class="py-2.5 text-slate-400">Belanja Harian (-)</td><td class="text-right py-2.5">Rp0</td><td class="text-right py-2.5">Rp0</td><td class="text-right py-2.5">Rp0</td></tr>
                    <tr class="border-b border-slate-50"><td class="py-2.5 text-slate-400">Cicilan (-)</td><td class="text-right py-2.5">Rp0</td><td class="text-right py-2.5">Rp0</td><td class="text-right py-2.5">Rp0</td></tr>
                    <tr class="border-b border-slate-100"><td class="py-2.5 text-slate-400">Tabungan (-)</td><td class="text-right py-2.5">Rp0</td><td class="text-right py-2.5">Rp0</td><td class="text-right py-2.5">Rp0</td></tr>
                    <tr class="bg-emerald-50/60 font-bold text-emerald-700"><td class="p-2.5 rounded-l-xl">SISA SALDO</td><td class="text-right p-2.5">Rp0</td><td class="text-right p-2.5">Rp0</td><td class="text-right p-2.5 rounded-r-xl">Rp0</td></tr>
                </tbody>
            </table>
        </div>
        
        <div id="error-dashboard" class="hidden mt-3 p-3 bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold leading-relaxed"></div>
    </div>

    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 mb-8">
        <div class="flex items-center gap-2 mb-5">
            <span class="text-xl">💸</span>
            <h2 class="font-bold text-slate-800 text-base">Catat Transaksi Baru</h2>
        </div>

        <form id="form-transaksi" onsubmit="handleSimpanTransaksi(event)" class="space-y-4">
            
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 tracking-wide">Catat Untuk Siapa?</label>
                <select id="input-nama" class="w-full p-3 bg-slate-50 border border-slate-200/80 rounded-xl text-sm font-semibold text-slate-700 focus:outline-hidden focus:border-emerald-500 focus:bg-white transition-all">
                    <option value="DIVA">🧑 DIVA</option>
                    <option value="WIDI">👩 WIDI</option>
                </select>
            </div>

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-600 mb-2">TANGGAL</label>
                    <input type="date" id="input-tanggal" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 bg-slate-50/50 text-sm font-medium text-slate-700 block appearance-none [color-scheme:light]">
                </div>

            <div class="p-3.5 border-2 border-dashed border-emerald-300 bg-emerald-50/30 rounded-2xl">
                <label class="block text-xs font-bold text-emerald-800 uppercase mb-1.5 flex items-center gap-1.5">
                    📸 Scan Gambar Struk / Bukti Transfer <span class="text-[10px] text-emerald-600 normal-case font-medium">(Opsional)</span>
                </label>
                <input type="file" id="input-file-ocr" accept="image/*" onchange="handleOcrScan(this)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 file:cursor-pointer cursor-pointer">
                
                <div id="status-ocr" class="hidden mt-2 text-xs font-medium flex items-center gap-1.5"></div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 tracking-wide">Jenis Transaksi</label>
                <select id="input-tipe" class="w-full p-3 bg-slate-50 border border-slate-200/80 rounded-xl text-sm font-semibold text-slate-700 focus:outline-hidden focus:border-emerald-500 focus:bg-white transition-all">
                    <option value="Belanja / Pengeluaran">📉 Belanja / Pengeluaran</option>
                    <option value="Pemasukan">📈 Pemasukan</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2">KATEGORI</label>
                <select id="input-kategori" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 bg-slate-50/50 text-sm font-medium text-slate-700 appearance-none">
                    <option value="Makanan & Minuman">🍔 Makanan & Minuman</option>
                    <option value="Cicilan">🏠 Pembayaran Cicilan</option>
                    <option value="Tabungan">🐷 Alokasi Tabungan</option>
                    <option value="Gaji (Pemicu Reset)">💰 Gaji (Pemicu Reset)</option>
                    <option value="Lain-lain">🌀 Kebutuhan Lainnya</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 tracking-wide">Keterangan</label>
                <input type="text" id="input-keterangan" placeholder="Contoh: Beli makan siang nasi jinggo" required class="w-full p-3 bg-slate-50 border border-slate-200/80 rounded-xl text-sm font-medium text-slate-700 focus:outline-hidden focus:border-emerald-500 focus:bg-white transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5 tracking-wide">Jumlah Uang (Rp)</label>
                <input type="number" id="input-jumlah" placeholder="Contoh: 50000" required class="w-full p-3 bg-slate-50 border border-slate-200/80 rounded-xl text-sm font-bold text-slate-700 focus:outline-hidden focus:border-emerald-500 focus:bg-white transition-all">
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-xs hover:shadow-md transition-all duration-150 cursor-pointer text-sm tracking-wide">
                Simpan Transaksi
            </button>
        </form>
    </div>

    <script>
    // ⚠️ PENTING: TEMPELKAN URL WEB APP GOOGLE APPS SCRIPT (/exec) ANDA DI SINI!
    const API_URL = "https://script.google.com/macros/s/AKfycbwAWStFkvXPcMsrj_0K8W5W3QlqXl9yX5TrK1ePh-ttziMTuylIg8ZTgjE_N8uVF6AK1w/exec";


    // Variabel global penyimpan data agar switch tab instan tanpa loading ulang
    let dataGlobalFinansial = null;
    let tabAktifSaatIni = "DIVA";

    // Atur tanggal default input form ke tanggal hari ini saat halaman dimuat
    document.addEventListener("DOMContentLoaded", () => {
        const hariIni = new Date().toISOString().split('T')[0];
        document.getElementById("input-tanggal").value = hariIni;
        ambilDataSistemDashboard();
    });

    /**
     * Mengambil data terupdate dari Google Sheet lewat API
     */
    function ambilDataSistemDashboard() {
        const statusWaktu = document.getElementById("waktu-update");
        const panelError = document.getElementById("error-dashboard");
        statusWaktu.innerText = "Memperbarui data dari Google Sheets...";
        panelError.classList.add("hidden");

        fetch(API_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "getDataDashboard" })
        })
        .then(res => res.json())
        .then(res => {
            if (res.error) {
                panelError.innerText = res.error;
                panelError.classList.remove("hidden");
                statusWaktu.innerText = "Gagal memperbarui.";
            } else {
                dataGlobalFinansial = res;
                statusWaktu.innerText = "Terakhir diperbarui: " + res.waktuUpdate;
                renderTabelDashboard(tabAktifSaatIni);
            }
        })
        .catch(err => {
            panelError.innerText = "Gagal terhubung ke server backend: " + err.toString();
            panelError.classList.remove("hidden");
            statusWaktu.innerText = "Koneksi terputus.";
        });
    }

    /**
     * Merender ulang tabel html berdasarkan tab nama yang dipilih
     */
    function renderTabelDashboard(nama) {
        if (!dataGlobalFinansial) return;
        
        document.getElementById("label-tabel-nama").innerText = nama;
        const barisData = nama === "DIVA" ? dataGlobalFinansial.diva : dataGlobalFinansial.widi;
        const containerTabel = document.getElementById("body-tabel-dashboard");
        
        let htmlElemen = "";
        
        // Loop data baris 1 sampai 4 (Pemasukan, Belanja, Cicilan, Tabungan)
        for (let r = 1; r <= 4; r++) {
            if (!barisData[r]) continue;
            htmlElemen += `<tr class="border-b border-slate-50">
                <td class="py-2.5 text-slate-400">${barisData[r][0]}</td>
                <td class="text-right py-2.5">${barisData[r][1] || 'Rp0'}</td>
                <td class="text-right py-2.5">${barisData[r][2] || 'Rp0'}</td>
                <td class="text-right py-2.5">${barisData[r][3] || 'Rp0'}</td>
            </tr>`;
        }
        
        // Tambahkan baris ke-5 sebagai Sisa Saldo dengan highlight khusus
        if (barisData[5]) {
            htmlElemen += `<tr class="bg-emerald-50/60 font-bold text-emerald-700">
                <td class="p-2.5 rounded-l-xl">${barisData[5][0]}</td>
                <td class="text-right p-2.5">${barisData[5][1] || 'Rp0'}</td>
                <td class="text-right p-2.5">${barisData[5][2] || 'Rp0'}</td>
                <td class="text-right p-2.5 rounded-r-xl">${barisData[5][3] || 'Rp0'}</td>
            </tr>`;
        }
        
        containerTabel.innerHTML = htmlElemen;
    }

    /**
     * Mengontrol perpindahan Tab tombol DIVA / WIDI
     */
    function switchTab(nama) {
        tabAktifSaatIni = nama;
        document.getElementById("badge-nama").innerText = nama;
        
        const btnDiva = document.getElementById("btn-tab-diva");
        const btnWidi = document.getElementById("btn-tab-widi");
        
        if (nama === "DIVA") {
            btnDiva.className = "py-2.5 rounded-xl font-bold text-sm transition-all duration-200 bg-white text-emerald-600 shadow-xs flex items-center justify-center gap-2 cursor-pointer";
            btnWidi.className = "py-2.5 rounded-xl font-bold text-sm transition-all duration-200 text-slate-500 hover:bg-white/50 flex items-center justify-center gap-2 cursor-pointer";
        } else {
            btnWidi.className = "py-2.5 rounded-xl font-bold text-sm transition-all duration-200 bg-white text-emerald-600 shadow-xs flex items-center justify-center gap-2 cursor-pointer";
            btnDiva.className = "py-2.5 rounded-xl font-bold text-sm transition-all duration-200 text-slate-500 hover:bg-white/50 flex items-center justify-center gap-2 cursor-pointer";
        }
        
        renderTabelDashboard(nama);
    }

    /**
     * Mengirimkan Form Inputan Data Transaksi Baru ke Google Sheet
     */
    function handleSimpanTransaksi(event) {
        event.preventDefault();
        
        const btnSubmit = document.getElementById("btn-submit");
        btnSubmit.innerText = "Menyimpan ke Google Sheet...";
        btnSubmit.disabled = true;
        
        const paketData = {
            tanggal: document.getElementById("input-tanggal").value,
            nama: document.getElementById("input-nama").value,
            tipe: document.getElementById("input-tipe").value,
            kategori: document.getElementById("input-kategori").value,
            keterangan: document.getElementById("input-keterangan").value,
            jumlah: document.getElementById("input-jumlah").value
        };

        fetch(API_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "tambahTransaksi", data: paketData })
        })
        .then(res => res.json())
        .then(res => {
            alert(res.pesan);
            if (res.sukses) {
                // Reset inputan teks form kecuali tanggal & nama seleksi
                document.getElementById("input-keterangan").value = "";
                document.getElementById("input-jumlah").value = "";
                document.getElementById("input-file-ocr").value = "";
                
                // Tarik data dashboard paling baru agar angka tabel langsung update otomatis
                ambilDataSistemDashboard();
            }
            btnSubmit.innerText = "Simpan Transaksi";
            btnSubmit.disabled = false;
        })
        .catch(err => {
            alert("Gagal menyimpan transaksi: " + err.toString());
            btnSubmit.innerText = "Simpan Transaksi";
            btnSubmit.disabled = false;
        });
    }

    /**
     * Menangani Upload Gambar & Proses OCR Teks Struk Belanja
     */
    function handleOcrScan(input) {
        const file = input.files[0];
        if (!file) return;

        const divStatus = document.getElementById("status-ocr");
        divStatus.className = "mt-2 text-xs font-semibold text-amber-600 flex items-center gap-1.5";
        divStatus.innerText = "⏳ Membaca teks struk belanja (OCR)...";
        divStatus.classList.remove("hidden");

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () {
            const hasilBase64Full = reader.result;
            const murniBase64 = hasilBase64Full.split(",")[1];
            
            fetch(API_URL, {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "prosesOcrStruk",
                    data: { base64Data: murniBase64, mimeType: file.type }
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.sukses) {
                    divStatus.className = "mt-2 text-xs font-semibold text-emerald-600 flex items-center gap-1.5";
                    divStatus.innerText = "✅ Berhasil mendeteksi nominal angka!";
                    
                    // Masukkan nominal hasil deteksi otomatis ke kotak jumlah uang
                    if (res.jumlah > 0) {
                        document.getElementById("input-jumlah").value = res.jumlah;
                    } else {
                        divStatus.className = "mt-2 text-xs font-semibold text-amber-600 flex items-center gap-1.5";
                        divStatus.innerText = "⚠️ Gambar berhasil dibaca, tapi gagal menemukan nominal angka. Mohon input manual.";
                    }
                } else {
                    divStatus.className = "mt-2 text-xs font-semibold text-rose-600 flex items-center gap-1.5";
                    divStatus.innerText = "❌ " + res.error;
                }
            })
            .catch(err => {
                divStatus.className = "mt-2 text-xs font-semibold text-rose-600 flex items-center gap-1.5";
                divStatus.innerText = "❌ Gagal OCR: " + err.toString();
            });
        };
    }

        // Ambil element dropdown Tipe dan Kategori
    const selectTipe = document.getElementById("input-tipe");
    const selectKategori = document.getElementById("input-kategori");
    
    // 1. Definisikan daftar pilihan kategori untuk Pengeluaran
    const opsiPengeluaran = `
        <option value="Makanan & Minuman">🍔 Makanan & Minuman</option>
        <option value="Belanja / Pengeluaran">🛍️ Belanja Harian</option>
        <option value="Cicilan">💳 Cicilan</option>
        <option value="Tabungan">🏦 Tabungan</option>
        <option value="Lain-lain">🌀 Lain-lain</option>
    `;
    
    // 2. Definisikan daftar pilihan kategori untuk Pemasukan
    const opsiPemasukan = `
        <option value="Gaji (Pemicu Reset)">💰 Gaji (Pemicu Reset)</option>
        <option value="THR / Bonus">🎁 THR / Bonus</option>
        <option value="Lainnya">✨ Lainnya</option>
    `;
    
    // Fungsi utama untuk merombak isi dropdown kategori sesuai Jenis Transaksi
    function sesuaikanPilihanKategori() {
        const tipeAktif = selectTipe.value;
        
        if (tipeAktif === "Pemasukan") {
            selectKategori.innerHTML = opsiPemasukan;
        } else {
            selectKategori.innerHTML = opsiPengeluaran;
        }
    }
    
    // Jalankan fungsi setiap kali user mengubah isi "Jenis Transaksi"
    selectTipe.addEventListener("change", sesuaikanPilihanKategori);
    
    // Pastikan fungsi juga berjalan saat halaman pertama kali dibuka (mengikuti default value form)
    document.addEventListener("DOMContentLoaded", () => {
        // Jalankan fungsi inisialisasi bawaan halaman Anda yang lain di sini jika ada
        sesuaikanPilihanKategori();
    });
        /**
 * Membuat dan mengunduh rekap keuangan bulanan dalam bentuk dokumen PDF
 */
function downloadRekapPDF() {
    if (!dataGlobalFinansial) {
        alert("Data belum siap atau sedang diperbarui. Silakan tunggu sebentar.");
        return;
    }

    const nama = tabAktifSaatIni; // "DIVA" atau "WIDI"
    const barisData = nama === "DIVA" ? dataGlobalFinansial.diva : dataGlobalFinansial.widi;
    const tanggalCetak = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

    // 1. Buat elemen HTML sementara khusus untuk template PDF yang rapi
    const elemenPdf = document.createElement("div");
    elemenPdf.style.padding = "24px";
    elemenPdf.style.fontFamily = "Arial, sans-serif";
    elemenPdf.style.color = "#334155";

    elemenPdf.innerHTML = `
        <div style="border-bottom: 2px solid #10b981; padding-bottom: 12px; margin-bottom: 20px;">
            <h2 style="font-size: 20px; font-weight: bold; color: #065f46; margin: 0;">📊 REKAP FINANSIAL BULANAN</h2>
            <p style="font-size: 12px; color: #64748b; margin: 6px 0 0 0;">Pemilik Akun: <b>${nama}</b> | Dicetak pada: ${tanggalCetak}</p>
        </div>

        <table style="width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px;">
            <thead>
                <tr style="background-color: #f8fafc; text-align: left; border-bottom: 2px solid #e2e8f0; color: #475569;">
                    <th style="padding: 10px;">Kategori</th>
                    <th style="padding: 10px; text-align: right;">Pemasukan</th>
                    <th style="padding: 10px; text-align: right;">Pengeluaran</th>
                    <th style="padding: 10px; text-align: right;">Subtotal</th>
                </tr>
            </thead>
            <tbody>
                ${[1, 2, 3, 4].map(r => {
                    if (!barisData[r]) return '';
                    return `
                        <tr style="border-bottom: 1px solid #f1f5f9;">
                            <td style="padding: 10px; font-weight: 600; color: #475569;">${barisData[r][0]}</td>
                            <td style="padding: 10px; text-align: right;">${barisData[r][1] || 'Rp0'}</td>
                            <td style="padding: 10px; text-align: right;">${barisData[r][2] || 'Rp0'}</td>
                            <td style="padding: 10px; text-align: right;">${barisData[r][3] || 'Rp0'}</td>
                        </tr>
                    `;
                }).join('')}
                ${barisData[5] ? `
                    <tr style="background-color: #ecfdf5; font-weight: bold; color: #047857; border-top: 2px solid #a7f3d0;">
                        <td style="padding: 12px;">${barisData[5][0]}</td>
                        <td style="padding: 12px; text-align: right;">${barisData[5][1] || 'Rp0'}</td>
                        <td style="padding: 12px; text-align: right;">${barisData[5][2] || 'Rp0'}</td>
                        <td style="padding: 12px; text-align: right;">${barisData[5][3] || 'Rp0'}</td>
                    </tr>
                ` : ''}
            </tbody>
        </table>

        <div style="margin-top: 40px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px dashed #cbd5e1; padding-top: 12px;">
            Dokumen ini dihasilkan secara otomatis oleh Dashboard Finansial Mandiri.
        </div>
    `;

    // 2. Pengaturan file PDF
    const opsiPdf = {
        margin:       12,
        filename:     `Rekap_Keuangan_${nama}_${new Date().toISOString().split('T')[0]}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    // 3. Proses konversi ke PDF dan unduh otomatis
    html2pdf().set(opsiPdf).from(elemenPdf).save();
}
</script>
</body>
